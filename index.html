<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExplainIt AI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>ExplainIt AI</h1>
        <p class="tagline">Simplify complex tech concepts and documentation instantly!</p>

        <div class="input-section">
            <textarea id="inputText" placeholder="Paste your complex technical text here..."></textarea>
            <input type="text" id="questionInput" placeholder="Ask a specific question about the text (optional)...">
            <button id="explainButton">Explain with AI</button>
        </div>

        <div class="output-section">
            <h2>AI Explanation:</h2>
            <div id="outputContent">
                <p>Your simplified explanations and answers will appear here.</p>
            </div>
        </div>

        <footer>
            <p>&copy; 2025 3MTT AI Project. Built by Angel Jones.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
